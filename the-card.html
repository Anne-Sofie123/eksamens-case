<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdenskort</title>

    <link rel="stylesheet" href="css/the-card.css">
    <link rel="stylesheet" href="css/akvarie.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

<div class="aquarium">
    <div class="ray" style="left:12%; animation-delay:0s;"></div>
    <div class="ray" style="left:30%; animation-delay:-1.5s; width:55px;"></div>
    <div class="ray" style="left:52%; animation-delay:-0.8s; width:70px;"></div>
    <div class="ray" style="left:74%; animation-delay:-2.2s;"></div>
    <div class="ray" style="left:90%; animation-delay:-1s; width:50px;"></div>

    <div id="bg-layer"></div>
    <div id="plants-layer"></div>

    <div class="sand"></div>
    <div class="vignette"></div>
    <div id="fg-layer"></div>
</div>

<!-- Tilbage knap -->
<a href="startside.html" id="go-back">
    <img src="img/tilbage-knap.png" alt="go back">
</a>

<main>

    <!-- Fiskebokse -->
    <div class="fish-box">

        <div class="fish-box-1" id="søhest-btn">
            <img src="img/søhest-verdenskortet.png" alt="søhest" id="fish-1-vector">
        </div>

        <div class="fish-box-2" id="guldfisk-btn">
            <img src="img/guldfisk-verdenskortet.png" alt="guldfisk" id="fish-2-vector">
        </div>

        <div class="fish-box-3" id="haj-btn">
            <img src="img/haj-verdenskortet.png" alt="haj" id="fish-3-vector">
        </div>

        <div class="fish-box-4" id="blæksprutte-btn">
            <img src="img/blæksprutte-verdenskortet.png" alt="blæksprutte" id="fish-4-vector">
        </div>

    </div>

    <!-- Verdenskort -->
    <div class="the-card-box">

        <img src="img/verdens-kort.png" alt="verdenskort" id="the-card-1">

        <!-- CIRKLER -->
        <img src="img/søhest-cirkel.png" class="map-circle" id="søhest-circle">
        <img src="img/guldfisk-cirkel.png" class="map-circle" id="guldfisk-circle">
        <img src="img/haj-cirkel.png" class="map-circle" id="haj-circle">
        <img src="img/blæksprutte-cirkel.png" class="map-circle" id="blæksprutte-circle">

    </div>

</main>

<script src="js/the-card.js"></script>

</body>
</html>
