<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akvarie</title>

    <link rel="stylesheet" href="css/startside.css">
    <link rel="stylesheet" href="css/akvarie.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

<div class="aquarium">
    <div class="ray" style="left:12%; animation-delay:0s;"></div>
    <div class="ray" style="left:30%; animation-delay:-1.5s; width:55px;"></div>
    <div class="ray" style="left:52%; animation-delay:-0.8s; width:70px;"></div>
    <div class="ray" style="left:74%; animation-delay:-2.2s;"></div>
    <div class="ray" style="left:90%; animation-delay:-1s; width:50px;"></div>

    <div id="bg-layer"></div>
    <div id="bubbles-layer"></div>
    <div id="plants-layer"></div>

    <div class="sand"></div>
    <div class="vignette"></div>
    <div id="fg-layer"></div>
</div>

<main id="welcome-page">

    <h1 id="welcome-header">Klar til at spille?</h1>

    <section id="boxes">

        <a class="green-box" href="the-card.html">
            <img src="img/globus.png" alt="globus">
        </a>

        <a class="green-box" href="akvarie.html">
            <img src="img/blå-fisk-lær-om-vores-fisk-boks.png" alt="blå fisk">
        </a>

        <a class="green-box" href="turning-cards.html">
            <img src="img/vende-spil-til-forsiden.png" alt="vendespil">
        </a>

    </section>

</main>

<script src="js/aquarium-bg.js"></script>

</body>
</html>
