<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lær om fiskene</title>

    <link rel="stylesheet" href="css/akvarie.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

<div class="aquarium">
    <div class="ray" style="left:12%; animation-delay:0s;"></div>
    <div class="ray" style="left:30%; animation-delay:-1.5s; width:55px;"></div>
    <div class="ray" style="left:52%; animation-delay:-0.8s; width:70px;"></div>
    <div class="ray" style="left:74%; animation-delay:-2.2s;"></div>
    <div class="ray" style="left:90%; animation-delay:-1s; width:50px;"></div>

    <div id="bg-layer"></div>
    <div id="plants-layer"></div>

    <div class="sand"></div>
    <div class="vignette"></div>
    <div id="fg-layer"></div>
</div>

<section id="akvarie">
    <div class="fish">

        <img src="img/søpindsvin.png" alt="søpindsvin" class="fish1" id="søpindsvin">
        <img src="img/fakta-boks-søpindsvin.png" class="fakta fish1-fakta">

        <img src="img/Søhest.png" alt="Søhest" class="fish2" id="søhest">
        <img src="img/fakta-boks-søhest.png" class="fakta fish2-fakta">

        <img src="img/skildpade.png" alt="skildpade" class="fish3" id="skildpade">
        <img src="img/fakta-boks-skildpadde.png" class="fakta fish3-fakta">

        <img src="img/lilla-havsnegl.png" alt="lilla-havsnegl" class="fish4" id="havsnegl">
        <img src="img/fakta-boks-havsnegl.png" class="fakta fish4-fakta">

        <img src="img/lilla-haj.png" alt="lilla-haj" class="fish5" id="lilla-haj">
        <img src="img/fakta-boks-haj-lilla.png" class="fakta fish5-fakta">

        <img src="img/lilla-blå-haj.png" alt="lilla-blå-haj" class="fish6" id="lilla-blå-haj">
        <img src="img/fakta-boks-haj-lilla-blå.png" class="fakta fish6-fakta">

        <img src="img/Krappe.png" alt="krabbe" class="fish7" id="krabbe">
        <img src="img/fakta-boks-krabbe.png" class="fakta fish7-fakta">

        <img src="img/havfrue.png" alt="havfrue" class="fish8" id="havfrue">
        <img src="img/fakta-boks-havfruen.png" class="fakta fish8-fakta">

        <img src="img/guld-fisk.png" alt="guldfisk" class="fish9" id="guldfisk">
        <img src="img/fakta-boks-guldfisk.png" class="fakta fish9-fakta">

        <img src="img/grøn-haj.png" alt="grøn-haj" class="fish10" id="grøn-haj">
        <img src="img/fakta-boks-haj-grøn.png" class="fakta fish10-fakta">

        <img src="img/grøn-blæksprut.png" alt="grøn-blæksprutte" class="fish11" id="grøn-blæksprutte">
        <img src="img/fakta-boks-blæksprutte-grøn.png" class="fakta fish11-fakta">

        <img src="img/delfin.png" alt="delfin" class="fish12" id="delfin">
        <img src="img/fakta-boks-delfin.png" class="fakta fish12-fakta">

        <img src="img/blæksprutte.png" alt="blæksprutte" class="fish13" id="blæksprutte">
        <img src="img/fakta-boks-blæksprut-lyserød.png" class="fakta fish13-fakta">

    </div>
</section>

<!-- Tilbage knap -->
<a href="startside.html" id="go-back">
    <img src="img/tilbage-knap.png" alt="Tilbage">
</a>

<script src="js/fish-swimming.js"></script>

</body>
</html>
