<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Road Animations</title>
     <link rel="stylesheet" href="css/akvarie.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Fredoka:wght@300..700&family=Julius+Sans+One&display=swap" rel="stylesheet">

</head>
<body>

<div class="aquarium">
  <div class="ray" style="left:12%; animation-delay:0s;"></div>
  <div class="ray" style="left:30%; animation-delay:-1.5s; width:55px;"></div>
  <div class="ray" style="left:52%; animation-delay:-0.8s; width:70px;"></div>
  <div class="ray" style="left:74%; animation-delay:-2.2s;"></div>
  <div class="ray" style="left:90%; animation-delay:-1s; width:50px;"></div>
  <div id="bg-layer"></div>
  <div id="bubbles-layer"></div>
  <div id="plants-layer"></div>
  <div class="sand"></div>
  <div class="vignette"></div>
  <div id="fg-layer"></div>
</div>

 <section id="akvarie">
    <div class="fish">
        <img src="img/søpindsvin.png" alt="søpindsvin" class="fish1" id="søpindsvin">
        <img src="img/Søhest.png" alt="Søhest" class="fish2" id="Søhest">
        <img src="img/skildpade.png" alt="skildpade" class="fish3" id="skildpade">
        <img src="img/lilla-havsnegl.png" alt="lilla-havsnegl" class="fish4" id="lilla-havsmegl">
        <img src="img/lilla-haj.png" alt="lilla-haj" class="fish5" id="lilla-haj">
        <img src="img/lilla-blå-haj.png" alt="lilla-blå-haj" class="fish6" id="lilla-blå-haj">
        <img src="img/Krappe.png" alt="krappe" class="fish7" id="krappe">
        <img src="img/havfrue.png" alt="havfrue" class="fish8" id="havfrue">
        <img src="img/guld-fisk.png" alt="guld-fisk" class="fish9" id="guld-fisk">
        <img src="img/grøn-haj.png" alt="grøn-haj" class="fish10" id="grønhaj">
        <img src="img/grøn-blæksprut.png" alt="grøn-blæksprut" class="fish11" id="grøn-blæksprut">
        <img src="img/delfin.png" alt="delfin" class="fish12" id="delfin">
        <img src="img/blæksprutte.png" alt="blæksprutte" class="fish13" id="blæksprutte">
        
       
    </div>
 </section>
<div id="faktaBoks">
 <div id="fiskeFakta" class="fiskeFakta"></div>
</div>

<!-- Tilbage knap -->
<a href="startside.html" id="go-back">
    <img src="img/tilbage-knap.png" alt="Tilbage">
</a>

 <script src="js/aquarium-bg.js"></script>
 <script src="js/fish-swimming.js"></script>
</body>
</html>
